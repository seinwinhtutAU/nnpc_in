<svg width="900" height="600" viewBox="0 0 900 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="explodedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="50%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="goldExploded" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4D03F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8962E"/>
    </linearGradient>
  </defs>
  
  <!-- Connection lines -->
  <line x1="200" y1="300" x2="350" y2="300" stroke="#D4AF37" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.4"/>
  <line x1="450" y1="300" x2="600" y2="300" stroke="#D4AF37" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.4"/>
  <line x1="700" y1="300" x2="800" y2="300" stroke="#D4AF37" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.4"/>
  
  <!-- Outer shell left -->
  <g transform="translate(80, 230)">
    <ellipse cx="60" cy="70" rx="70" ry="55" fill="url(#explodedGrad)" stroke="#2C2C2E" stroke-width="2"/>
    <text x="60" y="150" text-anchor="middle" font-family="system-ui" font-size="12" fill="#888">Composite Shell</text>
  </g>
  
  <!-- Driver assembly center-left -->
  <g transform="translate(280, 245)">
    <circle cx="55" cy="55" r="55" fill="#1C1C1E" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="55" cy="55" r="35" fill="#0B0B0B" stroke="#2C2C2E" stroke-width="1.5"/>
    <circle cx="55" cy="55" r="18" fill="#3B82F6" fill-opacity="0.3"/>
    <text x="55" y="135" text-anchor="middle" font-family="system-ui" font-size="12" fill="#888">11mm Driver</text>
  </g>
  
  <!-- Battery center -->
  <g transform="translate(480, 255)">
    <rect x="0" y="20" width="110" height="80" rx="10" fill="#1C1C1E" stroke="#D4AF37" stroke-width="2"/>
    <rect x="10" y="30" width="90" height="60" rx="5" fill="#0B0B0B"/>
    <text x="55" y="125" text-anchor="middle" font-family="system-ui" font-size="12" fill="#888">40Hr Battery</text>
  </g>
  
  <!-- Circuit board center-right -->
  <g transform="translate(680, 250)">
    <rect x="0" y="0" width="120" height="110" rx="8" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="2"/>
    <circle cx="30" cy="30" r="10" fill="#D4AF37"/>
    <circle cx="90" cy="30" r="8" fill="#3B82F6"/>
    <circle cx="60" cy="75" r="12" fill="#0B0B0B" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M30 30 L90 30 L60 75 Z" stroke="#3B82F6" stroke-width="1" fill="none" stroke-opacity="0.5"/>
    <text x="60" y="135" text-anchor="middle" font-family="system-ui" font-size="12" fill="#888">ANC Chipset</text>
  </g>
  
  <!-- Outer shell right -->
  <g transform="translate(800, 230)">
    <ellipse cx="60" cy="70" rx="70" ry="55" fill="url(#explodedGrad)" stroke="#2C2C2E" stroke-width="2"/>
    <circle cx="30" cy="65" r="7" fill="url(#goldExploded)"/>
  </g>
</svg>