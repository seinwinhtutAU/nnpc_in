<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="heroGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B0B0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="budBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="50%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4D03F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8962E"/>
    </linearGradient>
  </defs>
  
  <!-- Background glow -->
  <ellipse cx="400" cy="300" rx="350" ry="280" fill="url(#heroGlow)"/>
  
  <!-- Sound wave rings -->
  <circle cx="400" cy="300" r="220" stroke="#D4AF37" stroke-opacity="0.08" stroke-width="1" fill="none"/>
  <circle cx="400" cy="300" r="280" stroke="#3B82F6" stroke-opacity="0.06" stroke-width="1" fill="none"/>
  <circle cx="400" cy="300" r="340" stroke="#D4AF37" stroke-opacity="0.04" stroke-width="1" fill="none"/>
  
  <!-- Charging case (open) back -->
  <ellipse cx="400" cy="420" rx="160" ry="60" fill="#151515" stroke="#2C2C2E" stroke-width="2"/>
  <path d="M260 420 Q260 360 400 360 Q540 360 540 420 L540 430 Q540 470 400 470 Q260 470 260 430 Z" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="2"/>
  
  <!-- Left earbud -->
  <g transform="translate(280, 240) rotate(-15)">
    <!-- Stem -->
    <rect x="25" y="60" width="28" height="110" rx="14" fill="url(#budBlack)"/>
    <!-- Main body -->
    <ellipse cx="39" cy="45" rx="55" ry="42" fill="url(#budBlack)"/>
    <!-- Inner highlight -->
    <ellipse cx="39" cy="45" rx="35" ry="25" fill="#0B0B0B" stroke="#2C2C2E" stroke-width="1.5"/>
    <!-- Gold accent -->
    <circle cx="65" cy="40" r="6" fill="url(#goldAccent)"/>
    <!-- Mesh -->
    <circle cx="39" cy="72" r="8" fill="#2C2C2E"/>
  </g>
  
  <!-- Right earbud -->
  <g transform="translate(460, 240) rotate(15)">
    <!-- Stem -->
    <rect x="25" y="60" width="28" height="110" rx="14" fill="url(#budBlack)"/>
    <!-- Main body -->
    <ellipse cx="39" cy="45" rx="55" ry="42" fill="url(#budBlack)"/>
    <!-- Inner highlight -->
    <ellipse cx="39" cy="45" rx="35" ry="25" fill="#0B0B0B" stroke="#2C2C2E" stroke-width="1.5"/>
    <!-- Gold accent -->
    <circle cx="13" cy="40" r="6" fill="url(#goldAccent)"/>
    <!-- Mesh -->
    <circle cx="39" cy="72" r="8" fill="#2C2C2E"/>
  </g>
  
  <!-- Case front lip -->
  <path d="M260 420 Q260 450 400 450 Q540 450 540 420" stroke="#2C2C2E" stroke-width="2" fill="none"/>
  <rect x="380" y="410" width="40" height="4" rx="2" fill="#D4AF37" fill-opacity="0.5"/>
</svg>