<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="caseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="50%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="goldCase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4D03F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8962E"/>
    </linearGradient>
    <radialGradient id="caseShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <ellipse cx="300" cy="480" rx="200" ry="35" fill="url(#caseShadow)"/>
  
  <!-- Case bottom -->
  <rect x="120" y="220" width="360" height="220" rx="110" fill="url(#caseGrad)" stroke="#2C2C2E" stroke-width="2"/>
  
  <!-- Lid seam -->
  <path d="M140 330 Q300 350 460 330" stroke="#2C2C2E" stroke-width="2" fill="none"/>
  
  <!-- LED indicator -->
  <circle cx="300" cy="390" r="6" fill="#D4AF37" fill-opacity="0.8"/>
  
  <!-- USB-C port -->
  <rect x="270" y="430" width="60" height="14" rx="7" fill="#0B0B0B" stroke="#2C2C2E" stroke-width="2"/>
  
  <!-- Logo -->
  <text x="300" y="295" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="700" fill="#D4AF37" letter-spacing="6">FLASH</text>
</svg>